[workspace]
members = ["crates/core", "web"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/roudy16/noiseman"
rust-version = "1.89"

[package]
name = "noiseman"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# crates.io would build it without the vendored cpal and pulseaudio fixes ([patch] does not apply to dependents).
publish = false

# Prebuilt archives from the Release workflow (`cargo binstall --git https://github.com/roudy16/noiseman noiseman`).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
noiseman-core = { path = "crates/core" }
cpal = { version = "0.18", features = ["pulseaudio"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
font8x8 = { version = "0.3", optional = true, default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Embeds the icon and version info in noiseman.exe (build.rs); no default features, so no toml parser.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", optional = true, default-features = false, features = ["blocking", "tokio"] }

[features]
# Window and tray frontend; the default build is CLI + TUI only.
gui = ["dep:winit", "dep:softbuffer", "dep:font8x8", "dep:ksni"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# pulseaudio 0.3.2, vendored with three fixes: Reactor::recv reads 64 KiB chunks instead of zero-filling 1 MiB per read,
# handle_command removes a server-killed playback stream (PlaybackStreamKilled) so dropping it cannot hang, and
# socket_path_from_env finds the server socket where libpulse does (issue #24).
# Drop this once upstream (colinmarc/pulseaudio-rs) fixes all three.
[patch.crates-io]
pulseaudio = { path = "vendor/pulseaudio" }
# cpal 0.18.2 with the PulseAudio playback latency thread polling only on play/pause/drop.
cpal = { path = "vendor/cpal" }
