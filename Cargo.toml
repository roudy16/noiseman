[package]
name = "noiseman"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
font8x8 = { version = "0.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
