# Limits for `just gates` (tools/gates.py). Baselines measured 2026-11-24 on Linux x86_64 (PipeWire 1.6 pulse
# server), release build. Sizes and memory have ~10-30% headroom; thread and wakeup counts are design invariants
# (see AGENTS.md). Raise a limit only on purpose, in the commit that needs it, and say why.

[size]
noiseman_bytes = 900_000       # baseline 811,680 (default features, no gui)
wasm_bytes = 8_192             # baseline 6,182
web_total_bytes = 20_480       # baseline 17,599 (top-level target/web: page, css, js, wasm, favicon; not preview/)

[dsp]
# Worst kind (pink/blue ~3.0-3.2 ns here). Machine dependent: about 2x headroom, for a slower box or a busy one.
max_ns_per_sample = 6.0

[runtime]
# Playing: a real PulseAudio stream at zero gain, with the gate's one client connected.
playing_private_kb = 1_536     # baseline 1,156-1,228
playing_rss_kb = 5_120         # baseline 3,840-4,020
playing_threads = 6            # main, accept, 1 client reader, 3 audio
playing_cpu_percent = 0.5      # baseline 0.05-0.08
playing_wakeups_per_s = 40     # baseline 20-25 (context switches, all threads)
tui_private_kb = 384           # baseline 224-232, with the daemon running (shares the binary's pages)
cli_max_rss_kb = 4_096         # baseline 3,020-3,132 peak for `noiseman status`
# Muted, no clients: the stream is dropped and the daemon sleeps.
muted_private_kb = 1_536       # baseline 1,172-1,184
muted_threads = 2              # main, accept
muted_wakeups_per_s = 0

[windows]
# Limits for `just gates-windows` (tools/winperf.ps1), the Windows counterparts of [runtime] plus the GUI at idle.
# Baselines measured 2026-11-24 on Windows 11, Intel i9-11980HK laptop (Balanced plan, on AC), release build: 5 runs
# (GUI 3); a different machine from the Linux baselines, so compare like with like. Memory is the private working set
# (resident pages only this process uses); Windows' working set ("RSS") also counts shared system DLL pages. Threads
# are noiseman's own; Windows adds thread-pool, COM and WASAPI threads (playing 14 in all, muted 11, retiring to 7
# after a minute idle), reported but not gated. The size and DSP gates are the shared ones in tools/gates.py (needs
# Python); on this machine the DSP gate fails for pink and blue (12.7 and 13.6 ns/sample, white 1.8): see README TODO.
playing_private_kb = 1_920     # baseline 1,488-1,516
playing_rss_kb = 12_288        # baseline 9,968-9,996
playing_own_threads = 4        # main, accept, 1 client reader, 1 audio (cpal's WASAPI thread)
playing_cpu_percent = 0.5      # baseline 0.15-0.23
playing_wakeups_per_s = 140    # baseline 90-108: WASAPI shared mode wakes the stream every 10 ms
tui_private_kb = 1_024         # baseline 824-836, with the daemon running
cli_max_rss_kb = 7_168         # baseline 6,148-6,160 peak working set for `noiseman status`
muted_private_kb = 1_920       # baseline 1,420-1,468
muted_own_threads = 2          # main, accept
muted_wakeups_per_s = 0
# GUI (`--features gui`) attached to a muted daemon, idle after its first draw.
gui_private_kb = 3_584         # baseline 2,768-2,788
gui_rss_kb = 15_360            # baseline 12,500-12,524
gui_own_threads = 3
gui_idle_wakeups_per_s = 0
