# Builds release archives for Linux, macOS and Windows when a version tag (v*) is pushed, and publishes them, their
# checksums, tools/install.sh and tools/install.ps1 as a GitHub release. The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux builds run in an Ubuntu 22.04 container (glibc 2.35), so the binaries also run on older
          # distributions; the 22.04 runner images themselves are being retired.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, container: "ubuntu:22.04" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "ubuntu:22.04" }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev pkg-config libasound2-dev python3 binutils
      - uses: actions/checkout@v7
      # licenses.py; the Windows ARM image does not promise a Python on PATH.
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.x"
      # Third-party action pinned to a commit; bump the SHA (and comment) to update.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo pkgid -p noiseman | sed 's/.*[@#]//')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          grep -q "^## \\[$version\\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      # Both variants in one job: they share the target's dependency builds.
      - run: tools/package.sh ${{ matrix.target }} && tools/package.sh ${{ matrix.target }} gui
        shell: bash
      # README.md states glibc 2.34 as the minimum, and install.sh's explain_failure lists the distros that have it.
      - name: Check the binaries need glibc 2.34
        if: runner.os == 'Linux'
        run: |
          for archive in target/dist/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            tar -xzOf "$archive" "$name/noiseman" > "$RUNNER_TEMP/noiseman"
            glibc=$(objdump -T "$RUNNER_TEMP/noiseman" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            [ "$glibc" = GLIBC_2.34 ] ||
              { echo "$name needs $glibc, not GLIBC_2.34: update README.md and tools/install.sh's hint"; exit 1; }
          done
      # x86_64-apple-darwin builds on an arm64 runner, where install.sh picks the aarch64 archive; Windows is manual.
      - name: Install the archives with install.sh
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          export NOISEMAN_BASE_URL=file://$PWD/target/dist NOISEMAN_INSTALL_DIR=$RUNNER_TEMP/bin
          export XDG_DATA_HOME=$RUNNER_TEMP/share HOME=$RUNNER_TEMP/home
          mkdir -p "$HOME"
          for gui in "" 1; do
            NOISEMAN_GUI=$gui sh tools/install.sh
            version=$("$NOISEMAN_INSTALL_DIR/noiseman" --version)
            [ "$version" = "noiseman ${GITHUB_REF_NAME#v}" ] || { echo "installed $version, tag $GITHUB_REF_NAME"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The tag's CHANGELOG.md section, then which file is which; a tag without a section fails here, before publishing.
      - name: Write the release notes
        run: |
          # GitHub keeps single newlines in release notes, so join the CHANGELOG's wrapped continuation lines.
          awk -v h="[${GITHUB_REF_NAME#v}]" '/^## / { p = $2 == h; next } /^\[/ { p = 0 } p' CHANGELOG.md |
            awk 'NR > 1 && /^ +[^ ]/ { sub(/^ +/, " "); printf "%s", $0; next } NR > 1 { print "" } { printf "%s", $0 }
              END { if (NR) print "" }' > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          cat >> notes.md <<'EOF'

          ## Install

          See [Install](https://github.com/roudy16/noiseman#install) in the README for the installers and the unsigned binaries.

          **Which file?** Each archive has a `.sha256` checksum.
          - `noiseman-<target>`: the terminal build (command line and terminal UI)
          - `noiseman-gui-<target>`: the gui build, which adds the window (`noiseman gui`, with a tray icon on Linux)
          - Linux: `x86_64-unknown-linux-gnu` (Intel/AMD) or `aarch64-unknown-linux-gnu` (ARM)
          - macOS: `aarch64-apple-darwin` (Apple Silicon) or `x86_64-apple-darwin` (Intel)
          - Windows: `x86_64-pc-windows-msvc` (Intel/AMD) or `aarch64-pc-windows-msvc` (ARM)
          EOF
          cat notes.md
      # --generate-notes appends GitHub's notes (the Full Changelog link) after the file's.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* tools/install.sh tools/install.ps1 --verify-tag
          --notes-file notes.md --generate-notes --title "noiseman $GITHUB_REF_NAME"
