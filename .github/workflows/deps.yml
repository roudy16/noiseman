# Weekly `just deps` (tools/deps.py): fails when OSV (which mirrors RustSec) reports a vulnerability in a locked crate,
# so a new advisory surfaces without anyone running it; drift and informational advisories are only printed.
name: Deps

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tools/deps.py
