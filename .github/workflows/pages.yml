# Builds the web demo into target/web and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: [crates/core/**, web/**, docs/**, assets/noiseman.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to a commit; bump the SHA (and comment) to update.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build web demo
        run: |
          cargo build -q --release -p noiseman-web --target wasm32-unknown-unknown
          mkdir -p target/web/architecture
          cp web/site/* target/web/
          cp target/wasm32-unknown-unknown/release/noiseman_web.wasm target/web/noiseman.wasm
          cp assets/noiseman.svg target/web/favicon.svg
          cp docs/architecture.html target/web/architecture/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web
      - id: deployment
        uses: actions/deploy-pages@v5
